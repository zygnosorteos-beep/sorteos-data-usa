name: Zygno USA Data Transformer

on:
  push:
    paths:
      - 'raw_csv_usa/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exportar Sorteos USA a JSON
        run: python exportar_sorteos_usa.py
      - name: Commit y Push
        run: |
          git config --global user.name 'Zygno USA Bot'
          git config --global user.email 'bot@zygnousa.com'
          git add docs/*.json
          git commit -m "Auto-update USA Lottery JSONs: $(date)" || echo "Sin cambios"
          git push
